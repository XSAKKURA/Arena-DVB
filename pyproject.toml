[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-dvb"
version = "1.0.0"
description = "Автономный агент, играющий во все 21 игру на Igra Station Arena"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# Зависимостей нет намеренно: агент должен ставиться на любую машину, где есть
# Python 3, и работать дальше без присмотра.
dependencies = []

[project.urls]
Arena = "https://arena.roomcomm.xyz"
Documentation = "https://arena.roomcomm.xyz/agents.md"

[project.scripts]
arena-agent = "arena_agent.cli:main"

[tool.setuptools.packages.find]
include = ["arena_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
